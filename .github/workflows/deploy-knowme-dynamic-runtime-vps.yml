name: Verify KnowMe VPS signed release without SSH secrets

# Deployment is performed on the VPS by knowme-platform-sync.timer, which
# ONLY accepts a published preview release with verified Android signature,
# matching release metadata and successful exact-commit CI + APK checks.
# The GitHub workflow never copies an unreviewed checkout or private SSH key.
on:
  workflow_run:
    workflows: ['Publish compatible KnowMe Android preview update']
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'

permissions:
  contents: read
  checks: read
  statuses: write

concurrency:
  group: knowme-vps-verified-release
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
         (github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Resolve exact signed release of current main
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "Tresor562/knowMe_mpv" ]]
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          RELEASES="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=15")"
          TAG="$(printf '%s' "$RELEASES" | jq -r --arg sha "$SHA" '
            [.[] | select(.prerelease == true and .draft == false and .target_commitish == $sha)
             | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-preview$"))]
            | sort_by(.published_at) | last | .tag_name // empty
          ')"
          if [[ -z "$TAG" ]]; then
            echo '::notice::No immutable verified APK release for current main yet. VPS timer will reconcile it after CI and APK publication.'
            exit 0
          fi
          CHECKS="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100")"
          for CHECK in quality android-apk; do
            FOUND="$(printf '%s' "$CHECKS" | jq -r --arg name "$CHECK" '
              [.check_runs[] | select(.name == $name and .conclusion == "success")] | length
            ')"
            if [[ "$FOUND" -lt 1 ]]; then
              echo "::error::Missing validated $CHECK check for exact signed release commit."
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/knowme-release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"             --pattern knowme-update.json --dir "$RUNNER_TEMP/knowme-release"
          SOURCE_SHA="$SHA" RELEASE_TAG="$TAG" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const release = JSON.parse(readFileSync(
              process.env.RUNNER_TEMP + "/knowme-release/knowme-update.json", "utf8"
            ));
            if (!/^\d+\.\d+\.\d+$/.test(release.version) ||
                !Number.isSafeInteger(release.versionCode) ||
                !/^[a-f0-9]{64}$/i.test(release.sha256) ||
                "v"+release.version+"-preview"!==process.env.RELEASE_TAG ||
                release.url!=="https://github.com/Tresor562/knowMe_mpv/releases/download/"+
                  process.env.RELEASE_TAG+"/KnowMe-"+release.version+"-preview.apk") {
              throw Error("Signed-release metadata mismatch.");
            }
          '
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Verified commit $SHA is eligible for self-hosted VPS reconciliation."

      - name: Prove self-hosted VPS API Web and APK agree on signed release
        if: steps.source.outputs.sha != ''
        env:
          SHA: ${{ steps.source.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # The VPS timer performs the actual rollout, protected by its
          # own signed-release qualification, database backups and health checks.
          node --input-type=module <<'NODE'
          const sha=process.env.SHA;
          const base='https://31-56-85-53.sslip.io/knowme-api';
          const web='https://knowme.31-56-85-53.sslip.io/api/version';
          const deadline=Date.now()+40*60*1000;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function json(url) {
            const response=await fetch(url,{
              headers:{Accept:'application/json','Cache-Control':'no-store'},
              signal:AbortSignal.timeout(12000)
            });
            if(!response.ok)throw new Error('HTTP '+response.status);
            return response.json();
          }
          let count=0;
          while(Date.now()<deadline) {
            count++;
            try{
              const [api,site,ready,updates]=await Promise.all([
                json(base+'/platform-sync/version'),
                json(web),
                json(base+'/health/ready'),
                json(base+'/mobile-updates/android')
              ]);
              if(api?.commit===sha && site?.commit===sha && ready?.status==='ready' &&
                 Number.isSafeInteger(updates?.release?.versionCode) &&
                 typeof updates.release.sha256==='string' &&
                 /^[a-f0-9]{64}$/i.test(updates.release.sha256)) {
                console.log(JSON.stringify({ok:true,commit:sha,api:'ready',
                  selfHostedWeb:'matching',androidVersion:updates.release.version}));
                process.exit(0);
              }
              console.log('VPS sync not complete (attempt '+count+')');
            }catch(error) {
              console.log('VPS verification not ready (attempt '+count+'): '+
                (error instanceof Error?error.message:'unknown'));
            }
            await sleep(20000);
          }
          throw Error('VPS API and Web have not reconciled to exact signed release SHA.');
          NODE
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          [[ "$CURRENT" == "$SHA" ]] || {
            echo '::error::Main advanced during verification; cannot certify older release as current.'
            exit 1
          }

      - name: Record verified VPS delivery on source commit
        if: always() && steps.source.outputs.sha != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.source.outputs.sha }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          STATE=failure
          DESCRIPTION='VPS release not verified; inspect KnowMe self-hosted reconciler'
          if [[ "$RESULT" == success ]]; then
            STATE=success
            DESCRIPTION='Verified signed release, VPS API/Web SHA and readiness'
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA"             -f state="$STATE" -f context="KnowMe verified VPS signed release"             -f description="$DESCRIPTION"             -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"             --silent
