name: One-shot Multer security refresh

on:
  push:
    branches:
      - agent/knowme-light-discover-2026-09-16
    paths:
      - .github/workflows/maintenance-multer-security-refresh.yml

permissions:
  contents: write

jobs:
  refresh-multer-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.13.1
          run_install: false

      - name: Refresh patched Multer lock entry
        run: pnpm --filter @knowme/api add multer@2.3.0 --save-exact --lockfile-only

      - name: Commit security refresh and remove one-shot workflow
        run: |
          rm .github/workflows/maintenance-multer-security-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/package.json pnpm-lock.yaml .github/workflows/maintenance-multer-security-refresh.yml
          git diff --cached --check
          git commit -m "fix: refresh lockfile for Multer 2.3.0"
          git push origin HEAD:agent/knowme-light-discover-2026-09-16
