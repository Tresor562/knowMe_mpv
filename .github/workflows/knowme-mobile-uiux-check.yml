name: KnowMe Mobile UIUX Check

on:
  push:
    branches:
      - feat/knowme-master-uiux-spec
    paths:
      - '.github/workflows/knowme-mobile-uiux-check.yml'
      - 'apps/mobile/**'
      - 'packages/i18n-contract/**'
      - 'packages/ui/**'
      - 'packages/animation-contract/**'
      - 'packages/link-contract/**'
      - 'packages/media-cache-contract/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build mobile workspace dependencies and validate TypeScript
        run: pnpm --filter @knowme/mobile... build
      - name: Run mobile tests
        run: pnpm --filter @knowme/mobile test
