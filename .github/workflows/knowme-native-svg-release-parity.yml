name: KnowMe native SVG release compatibility

on:
  pull_request:
    paths:
      - 'scripts/check-knowme-native-vector-release-parity.mjs'
      - 'scripts/check-knowme-native-vector-release-parity.test.mjs'
      - '.github/workflows/knowme-native-svg-release-parity.yml'
      - '.github/workflows/knowme-compatible-preview-update.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/check-knowme-native-vector-release-parity.mjs'
      - 'scripts/check-knowme-native-vector-release-parity.test.mjs'
      - '.github/workflows/knowme-native-svg-release-parity.yml'
      - '.github/workflows/knowme-compatible-preview-update.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-svg-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      # The release parity gate re-exports canonical icon paths using the
      # pinned TypeScript parser. Checking without dependencies falsely fails.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Install TypeScript for source geometry parity
        if: github.event_name != 'pull_request'
        run: pnpm install --frozen-lockfile
      - name: Test immutable release lineage and downgrade prevention
        run: node --test scripts/check-knowme-native-vector-release-parity.test.mjs
      # On pull requests, never expose a repo token to code from an unmerged
      # branch. The same check runs against the live GitHub baseline after merge.
      - name: Verify last published signed APK source and native SVG parity
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-knowme-native-vector-release-parity.mjs
