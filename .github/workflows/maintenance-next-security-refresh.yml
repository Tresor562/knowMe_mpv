name: One-shot Next.js security refresh

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/maintenance-next-security-refresh.yml

permissions:
  contents: write

jobs:
  refresh-next-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.13.1

      - name: Upgrade Next.js to patched release and refresh lockfile
        run: pnpm --filter @knowme/web add next@15.5.24 --save-exact --lockfile-only

      - name: Commit security refresh and remove one-shot workflow
        run: |
          rm .github/workflows/maintenance-next-security-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json pnpm-lock.yaml .github/workflows/maintenance-next-security-refresh.yml
          git diff --cached --check
          git commit -m "fix: upgrade Next.js to 15.5.24"
          git push origin HEAD:main
