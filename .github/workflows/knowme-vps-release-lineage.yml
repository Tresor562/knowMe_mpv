name: KnowMe VPS release source lineage

on:
  pull_request:
    paths:
      - 'ops/sync-knowme-platform-vps.mjs'
      - 'ops/sync-knowme-platform-vps.test.mjs'
      - '.github/workflows/knowme-vps-release-lineage.yml'
  push:
    branches: [main]
    paths:
      - 'ops/sync-knowme-platform-vps.mjs'
      - 'ops/sync-knowme-platform-vps.test.mjs'
      - '.github/workflows/knowme-vps-release-lineage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-ancestry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
      - name: Check reconciler syntax
        run: node --check ops/sync-knowme-platform-vps.mjs
      - name: Test fail-closed release ancestry
        run: node --test ops/sync-knowme-platform-vps.test.mjs
