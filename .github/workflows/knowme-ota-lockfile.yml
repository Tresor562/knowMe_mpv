name: Update KnowMe OTA lockfile
on:
  push:
    branches: ['feat/dynamic-runtime-experience-20261017']
    paths:
      - 'apps/mobile/package.json'
      - '.github/workflows/knowme-ota-lockfile.yml'
permissions:
  contents: write
jobs:
  sync-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Update dependency lock only
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit reproducible dependency graph on this feature branch
        run: |
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(ota): lock expo-updates SDK 53 dependency"
          git push origin "HEAD:${GITHUB_REF_NAME}"
