name: Refresh security lockfile

on:
  push:
    branches:
      - fix/dependency-audit-2026-10

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/dependency-audit-2026-10
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - name: Regenerate lockfile from exact security overrides
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(security): regenerate lockfile for patched dependencies"
          git push origin HEAD:fix/dependency-audit-2026-10
