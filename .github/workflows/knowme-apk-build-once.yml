name: KnowMe APK Build Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/knowme-apk-build-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_PUBLIC_API_URL: https://knowmempv.vercel.app/api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate mobile TypeScript
        run: pnpm --filter @knowme/mobile build

      - name: Generate Android project
        run: pnpm --filter @knowme/mobile exec expo prebuild --platform android --clean --no-install

      - name: Build installable release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk artifacts/KnowMe-1.0.0-preview.apk
          sha256sum artifacts/KnowMe-1.0.0-preview.apk | tee artifacts/KnowMe-1.0.0-preview.apk.sha256
          ls -lh artifacts/KnowMe-1.0.0-preview.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: knowme-android-apk
          path: |
            artifacts/KnowMe-1.0.0-preview.apk
            artifacts/KnowMe-1.0.0-preview.apk.sha256
          if-no-files-found: error
          retention-days: 7
