name: KnowMe Reply Validation

on:
  push:
    branches:
      - feat/knowme-master-uiux-spec
    paths:
      - '.github/workflows/knowme-reply-validation.yml'
      - 'apps/api/prisma/**'
      - 'apps/api/src/messaging/**'
      - 'apps/api/test/core-flows.e2e-spec.ts'
      - 'apps/mobile/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reply-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: '1'
      DATABASE_URL: postgresql://knowme:knowme@localhost:5432/knowme_test?schema=public
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-tests
      NEXT_PUBLIC_API_URL: http://localhost:4000
      PORT: 4000
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: knowme
          POSTGRES_PASSWORD: knowme
          POSTGRES_DB: knowme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowme -d knowme_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @knowme/api prisma:generate
      - run: pnpm db:migrate:deploy
      - name: Verify migration matches datamodel
        run: pnpm --filter @knowme/api exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma --exit-code
      - name: Build API
        run: pnpm --filter @knowme/api... build
      - name: Build mobile
        run: pnpm --filter @knowme/mobile... build
      - name: Test reply e2e flow
        run: pnpm --filter @knowme/api exec jest --config ./test/jest-e2e.json --runInBand core-flows.e2e-spec.ts
      - name: Run mobile tests
        run: pnpm --filter @knowme/mobile test
