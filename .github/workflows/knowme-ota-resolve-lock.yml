name: Resolve Expo OTA dependency lock for integration
on:
  push:
    branches: [feat/knowme-expo-ota-transition-20261016]
    paths:
      - apps/mobile/package.json
      - .github/workflows/knowme-ota-resolve-lock.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: knowme-ota-lockfile
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/knowme-expo-ota-transition-20261016
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - name: Resolve exact SDK 53 package with official registry
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Commit generated dependency lock (never hand-edit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(ota): lock expo-updates 0.28.18 with pnpm'
          git fetch origin feat/knowme-expo-ota-transition-20261016
          git rebase origin/feat/knowme-expo-ota-transition-20261016
          git push origin HEAD:feat/knowme-expo-ota-transition-20261016
