name: KMD-059 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/kmd-059-call-preferences
    paths:
      - .github/workflows/kmd-059-android-apk.yml

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'

    steps:
      - name: Checkout KMD-059 branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android native project with Expo
        run: pnpm --filter @knowme/mobile exec expo prebuild --platform android --clean

      - name: Build installable debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload KnowMe APK
        uses: actions/upload-artifact@v4
        with:
          name: knowme-kmd-059-android-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
