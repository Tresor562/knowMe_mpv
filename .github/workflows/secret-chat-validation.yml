name: Secret Chat validation

on:
  push:
    branches:
      - feat/knowme-secret-chat-envelopes

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://knowme:knowme@localhost:5432/knowme_secret_chat?schema=public
      JWT_SECRET: secret-chat-ci-only-jwt-secret-long-enough-for-tests
      ACCOUNT_SECURITY_ENCRYPTION_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: knowme
          POSTGRES_PASSWORD: knowme
          POSTGRES_DB: knowme_secret_chat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowme -d knowme_secret_chat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @knowme/api prisma:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm --filter @knowme/api build
      - name: Run E2EE unit tests
        run: pnpm --filter @knowme/api exec jest --runInBand src/e2ee/e2ee.domain.spec.ts src/e2ee/e2ee.service.spec.ts src/e2ee/secret-chat.domain.spec.ts
      - name: Run E2EE API tests
        run: pnpm --filter @knowme/api exec jest --config ./test/jest-e2e.json --runInBand test/e2ee.e2e-spec.ts test/secret-chat.e2e-spec.ts
