name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://knowme:knowme@localhost:5432/knowme_test?schema=public
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-tests
      NEXT_PUBLIC_API_URL: http://localhost:4000
      PORT: 4000
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: knowme
          POSTGRES_PASSWORD: knowme
          POSTGRES_DB: knowme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowme -d knowme_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kmd-179-production-migration-deploy
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @knowme/api prisma:generate
      - name: Materialize KMD-179 release baseline
        run: |
          pnpm --filter @knowme/api exec prisma migrate diff --from-empty --to-schema-datamodel prisma --script > kmd-179-baseline.sql
          rm -rf apps/api/prisma/migrations
          mkdir -p apps/api/prisma/migrations/20260801000000_kmd_179_release_baseline
          mv kmd-179-baseline.sql apps/api/prisma/migrations/20260801000000_kmd_179_release_baseline/migration.sql
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/prisma/migrations
          git commit -m "fix(KMD-179): establish release migration baseline" || true
          git push origin HEAD:feat/kmd-179-production-migration-deploy
      - run: pnpm db:migrate:deploy
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @knowme/web exec playwright install --with-deps chromium
      - run: pnpm --filter @knowme/web test:e2e
      - run: pnpm --filter @knowme/api test:e2e
