name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://knowme:knowme@localhost:5432/knowme_test?schema=public
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-tests
      PORT: 4000
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: knowme
          POSTGRES_PASSWORD: knowme
          POSTGRES_DB: knowme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowme -d knowme_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @knowme/api prisma:generate
      - run: pnpm --filter @knowme/api prisma:push
      - run: pnpm build
      - run: pnpm test
      - name: Diagnose KMD-061 short-link E2E
        run: pnpm --filter @knowme/api exec jest --config ./test/jest-e2e.json --runInBand test/short-links.e2e-spec.ts > short-links-e2e.log 2>&1 || true
      - name: Upload KMD-061 E2E diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: kmd-061-e2e-diagnostic
          path: short-links-e2e.log
          if-no-files-found: error
      - run: pnpm --filter @knowme/api test:e2e
