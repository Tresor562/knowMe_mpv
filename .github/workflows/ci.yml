name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://knowme:knowme@localhost:5432/knowme_test?schema=public
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-tests
      PORT: 4000
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: knowme
          POSTGRES_PASSWORD: knowme
          POSTGRES_DB: knowme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowme -d knowme_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @knowme/api prisma:generate
      - run: pnpm --filter @knowme/api prisma:push
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @knowme/web exec playwright install --with-deps chromium
      - run: pnpm --filter @knowme/web test:e2e
      - run: pnpm --filter @knowme/api test:e2e

  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
    steps:
      - name: Checkout KMD-059 branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android native project with Expo
        run: pnpm --filter @knowme/mobile exec expo prebuild --platform android --clean

      - name: Build installable debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload KnowMe APK
        uses: actions/upload-artifact@v4
        with:
          name: knowme-kmd-059-android-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
