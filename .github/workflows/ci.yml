name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://knowme:knowme@localhost:5432/knowme_test?schema=public
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-tests
      NEXT_PUBLIC_API_URL: http://localhost:4000
      PORT: 4000
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: knowme
          POSTGRES_PASSWORD: knowme
          POSTGRES_DB: knowme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowme -d knowme_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify CI workflow supply-chain policy
        run: node --test scripts/ci-workflow-supply-chain-preflight.test.mjs
      - run: pnpm install --frozen-lockfile=false
      - name: Audit production dependencies for high and critical advisories
        run: >-
          pnpm audit --prod --audit-level=high
          --ignore GHSA-w3rx-r6r6-pgpr
          --ignore GHSA-5p2g-fcmc-qvqq
      - run: pnpm --filter @knowme/api prisma:generate
      - run: pnpm db:migrate:deploy
      - name: Verify committed migrations match Prisma datamodel
        run: pnpm --filter @knowme/api exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma --exit-code
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @knowme/web exec playwright install --with-deps chromium
      - run: pnpm --filter @knowme/web test:e2e
      - run: pnpm --filter @knowme/api test:e2e
