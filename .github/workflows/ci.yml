name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://knowme:knowme@localhost:5432/knowme_test?schema=public
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-tests
      PORT: 4000
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: knowme
          POSTGRES_PASSWORD: knowme
          POSTGRES_DB: knowme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowme -d knowme_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @knowme/api prisma:generate
      - run: pnpm --filter @knowme/api prisma:push
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @knowme/web exec playwright install --with-deps chromium
      - run: pnpm --filter @knowme/web test:e2e
      - run: pnpm --filter @knowme/api test:e2e

  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      NODE_ENV: production
    steps:
      - name: Checkout KMD-059 branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Generate Android native project with Expo
        run: pnpm --filter @knowme/mobile exec expo prebuild --platform android --clean

      - name: Generate and correct Expo SDK 53 autolinking source
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:generateAutolinkingPackageList --no-daemon
          PACKAGE_LIST="app/build/generated/autolinking/src/main/java/com/facebook/react/PackageList.java"
          test -f "$PACKAGE_LIST"
          grep -q 'expo.core.ExpoModulesPackage' "$PACKAGE_LIST"
          sed -i 's/expo\.core\.ExpoModulesPackage/expo.modules.ExpoModulesPackage/g' "$PACKAGE_LIST"
          grep -q 'expo.modules.ExpoModulesPackage' "$PACKAGE_LIST"

      - name: Build standalone release APK with embedded JavaScript bundle
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -x :app:generateAutolinkingPackageList

      - name: Verify embedded JavaScript bundle exists
        run: |
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -E 'assets/(index\.android\.bundle|.*\.bundle)' >/dev/null

      - name: Upload standalone KnowMe APK
        uses: actions/upload-artifact@v4
        with:
          name: knowme-kmd-059-android-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
