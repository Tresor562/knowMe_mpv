name: Temporary KnowMe Next.js security lockfile regeneration

on:
  push:
    branches: [chat/infra/nextjs-15528-security]
    paths:
      - 'package.json'
      - '.github/workflows/knowme-nextjs-lock-sync.yml'

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.repository == 'Tresor562/knowMe_mpv' && github.ref == 'refs/heads/chat/infra/nextjs-15528-security'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - name: Refresh lockfile using trusted registry metadata without install scripts
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Lockfile already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): regenerate lockfile for Next.js 15.5.28'
          git push origin HEAD:chat/infra/nextjs-15528-security
