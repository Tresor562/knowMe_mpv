name: KnowMe coordination guard

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: knowme-coordination-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  coordination:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - name: Validate coordination guard logic
        run: node --test scripts/coordination-check.test.mjs
      - name: Compare with concurrent GitHub pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/coordination-check.mjs
