name: Telegram storage targeted validation
on:
  push:
    branches:
      - feat/knowme-telegram-three-channel-storage-20261010

permissions:
  contents: read

jobs:
  telegram-storage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - run: pnpm install --frozen-lockfile
      - name: Validate backup/restore script syntax
        run: |
          node --check ops/backup-knowme-postgres-telegram.mjs
          node --check ops/verify-knowme-postgres-telegram-backup.mjs
      - run: pnpm --filter @knowme/api prisma:generate
      - run: pnpm --filter @knowme/api build
      - run: pnpm --filter @knowme/api exec jest src/media/telegram-media-storage.spec.ts --runInBand
