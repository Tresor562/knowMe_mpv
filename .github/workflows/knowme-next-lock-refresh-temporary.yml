name: KnowMe Next patch lock regeneration (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lock-refresh:
    if: github.head_ref == 'chat/infra/nextjs-security-15-5-28-20261022'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - name: Generate patched lockfile with official pnpm registry resolution
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Print read-only base64-encoded lockfile for reviewed PR update
        run: |
          node - <<'NODE'
          const {readFileSync} = require('node:fs');
          const data = readFileSync('pnpm-lock.yaml').toString('base64');
          const size = 6000;
          for (let i=0; i < Math.ceil(data.length / size); i++) {
            console.log('KMLOCK_PART '+i+' '+data.slice(i*size, (i+1)*size));
          }
          console.log('KMLOCK_END '+Math.ceil(data.length/size));
          NODE
