name: Security patch lockfile refresh (branch only)
on:
  push:
    branches:
      - feat/knowme-telegram-three-channel-storage-20261010
    paths:
      - package.json
      - .github/workflows/security-patch-lockfile-refresh.yml
permissions:
  contents: write
jobs:
  update-lock:
    if: github.ref == 'refs/heads/feat/knowme-telegram-three-channel-storage-20261010'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - name: Refresh locked resolutions for reviewed security patches
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit only lockfile on the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already matches the security overrides"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pnpm-lock.yaml
          git diff --cached --stat
          git commit -m "fix(lockfile): resolve patched production dependency versions"
          git push origin HEAD:refs/heads/feat/knowme-telegram-three-channel-storage-20261010
