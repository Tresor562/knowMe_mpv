name: Publish KnowMe Android preview
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-knowme-android.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require full Web/Android parity before public APK publication
        run: node scripts/platform-sync-preflight.mjs --release
      - name: Read immutable release version
        run: |
          set -euo pipefail
          echo "KNOWME_VERSION=$(node -p 'require("./packages/link-contract/src/platform-sync.json").productVersion')" >> "$GITHUB_ENV"
      - name: Find same-commit signed KnowMe APK artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          data="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="knowme-android-apk" and .expired==false and .workflow_run.head_sha=="'${GITHUB_SHA}'") | [.created_at, .id] | @tsv' | sort -r | head -n1)"
          if [[ -z "$data" ]]; then
            echo "::error::No APK from this exact release commit was found. Re-run the APK build workflow, then dispatch this workflow."
            exit 1
          fi
          id="$(printf '%s' "$data" | cut -f2)"
          echo "artifact_id=$id" >> "$GITHUB_OUTPUT"

      - name: Download and validate APK
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > artifact.zip
          APK="KnowMe-${KNOWME_VERSION}-preview.apk"
          unzip -j -o artifact.zip "*$APK" -d dist
          unzip -j -o artifact.zip "*$APK.sha256" -d dist
          test -s "dist/$APK"
          test -s "dist/$APK.sha256"
          bytes="$(stat -c %s "dist/$APK")"
          test "$bytes" -gt 10000000
          unzip -tqq "dist/$APK"
          (cd dist && sha256sum -c "$APK.sha256")
          ls -lh dist/*

      - name: Publish public prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${KNOWME_VERSION}-preview"
          APK="KnowMe-${KNOWME_VERSION}-preview.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::The release tag already exists. Never replace an APK under the same version; bump KnowMe versions first."
            exit 1
          fi
          gh release create "$TAG" "dist/$APK" "dist/$APK.sha256" --prerelease --title "KnowMe Android — prévisualisation ${KNOWME_VERSION}" --notes "Build issu d'un seul commit qualifié. L'APK Android doit être testé sur appareil réel avant toute diffusion générale."
          gh release view "$TAG" --json url -q .url
