name: Publish KnowMe signed Android update

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/app.json'
      - 'packages/link-contract/src/platform-sync.json'
      - '.github/workflows/publish-knowme-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knowme-signed-android-release
  cancel-in-progress: false

jobs:
  publish-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CI: '1'
      EXPO_PUBLIC_API_URL: https://31-56-85-53.sslip.io/knowme-api
      EXPO_PUBLIC_RELEASE_COMMIT: ${{ github.sha }}
      KNOWME_ANDROID_KEYSTORE_BASE64: ${{ secrets.KNOWME_ANDROID_KEYSTORE_BASE64 }}
      KNOWME_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KNOWME_ANDROID_KEYSTORE_PASSWORD }}
      KNOWME_ANDROID_KEY_ALIAS: ${{ secrets.KNOWME_ANDROID_KEY_ALIAS }}
      KNOWME_ANDROID_KEY_PASSWORD: ${{ secrets.KNOWME_ANDROID_KEY_PASSWORD }}
      KNOWME_ANDROID_EXPECTED_CERT_SHA256: ${{ secrets.KNOWME_ANDROID_EXPECTED_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Require full Web and Android release parity
        run: node scripts/platform-sync-preflight.mjs --release

      - name: Require private persistent signing key and trusted old APK certificate
        shell: bash
        run: |
          set -euo pipefail
          for name in KNOWME_ANDROID_KEYSTORE_BASE64 KNOWME_ANDROID_KEYSTORE_PASSWORD KNOWME_ANDROID_KEY_ALIAS KNOWME_ANDROID_KEY_PASSWORD KNOWME_ANDROID_EXPECTED_CERT_SHA256; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required private release configuration: $name"
              exit 1
            fi
          done
          expected="$(printf '%s' "$KNOWME_ANDROID_EXPECTED_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')"
          if [[ ! "$expected" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Expected installed APK signing certificate SHA-256 must be 64 hexadecimal characters."
            exit 1
          fi
          keystore="$RUNNER_TEMP/knowme-release.jks"
          (umask 077 && printf '%s' "$KNOWME_ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore")
          cert="$(keytool -exportcert -keystore "$keystore" -alias "$KNOWME_ANDROID_KEY_ALIAS" -storepass "$KNOWME_ANDROID_KEYSTORE_PASSWORD" -keypass "$KNOWME_ANDROID_KEY_PASSWORD" 2>/dev/null | openssl dgst -sha256 -r | awk '{print tolower($1)}')"
          if [[ "$cert" != "$expected" ]]; then
            echo "::error::Release signing certificate differs from the pinned certificate of the installed KnowMe APK."
            exit 1
          fi
          echo "KNOWME_ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "KNOWME_ANDROID_SIGNER_CERT_SHA256=$cert" >> "$GITHUB_ENV"

      - name: Prepare Expo-compatible pnpm layout
        run: printf '%s\n' 'shamefully-hoist=true' > .npmrc
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile mobile workspace dependencies and validate TypeScript
        run: pnpm --filter @knowme/mobile... build
      - name: Generate native Android project
        run: pnpm --filter @knowme/mobile exec expo prebuild --platform android --clean --no-install
      - name: Configure Gradle release signing from private keystore
        run: node scripts/configure-knowme-android-signing.mjs
      - name: Build signed release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK identity, version, signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version="$(node -p 'require("./packages/link-contract/src/platform-sync.json").productVersion')"
          android_version="$(node -p 'require("./apps/mobile/app.json").expo.version')"
          version_code="$(node -p 'require("./apps/mobile/app.json").expo.android.versionCode')"
          test "$version" = "$android_version"
          [[ "$version_code" =~ ^[0-9]+$ ]] && (( version_code > 3 ))
          tag="v$version-update"
          filename="KnowMe-$version-update.apk"
          apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$tools_dir/apksigner" verify --verbose "$apk"
          cert="$("$tools_dir/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr 'A-F' 'a-f' | head -n 1)"
          test "$cert" = "$KNOWME_ANDROID_SIGNER_CERT_SHA256"
          metadata="$("$tools_dir/aapt" dump badging "$apk" | head -n 1)"
          expected="package: name='com.knowme.app' versionCode='$version_code' versionName='$version'"
          [[ "$metadata" == "$expected"* ]] || {
            echo "::error::APK package or version does not match this update release."
            exit 1
          }
          cp "$apk" "dist/$filename"
          (cd dist && sha256sum "$filename" > "$filename.sha256")
          sha="$(sha256sum "dist/$filename" | awk '{print $1}')"
          export KNOWME_UPDATE_VERSION="$version"
          export KNOWME_UPDATE_VERSION_CODE="$version_code"
          export KNOWME_UPDATE_TAG="$tag"
          export KNOWME_UPDATE_FILENAME="$filename"
          export KNOWME_UPDATE_SHA256="$sha"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ['KNOWME_UPDATE_VERSION']
          payload = {
              "versionCode": int(os.environ['KNOWME_UPDATE_VERSION_CODE']),
              "version": version,
              "url": "https://github.com/Tresor562/knowMe_mpv/releases/download/" +
                     os.environ['KNOWME_UPDATE_TAG'] + "/" + os.environ['KNOWME_UPDATE_FILENAME'],
              "sha256": os.environ['KNOWME_UPDATE_SHA256'],
              "notes": "Ajout et gestion des amis depuis les profils, améliorations et vérification des mises à jour.",
              "required": False
          }
          Path("dist/knowme-update.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
          echo "KNOWME_UPDATE_TAG=$tag" >> "$GITHUB_ENV"
          echo "KNOWME_UPDATE_FILENAME=$filename" >> "$GITHUB_ENV"

      - name: Publish immutable GitHub prerelease and Android update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$KNOWME_UPDATE_TAG" >/dev/null 2>&1; then
            echo "::error::Update release version already exists. Bump version and versionCode; never replace installed update bytes."
            exit 1
          fi
          gh release create "$KNOWME_UPDATE_TAG" \
            "dist/$KNOWME_UPDATE_FILENAME" \
            "dist/$KNOWME_UPDATE_FILENAME.sha256" \
            "dist/knowme-update.json" \
            --prerelease \
            --title "KnowMe Android — mise à jour $KNOWME_UPDATE_TAG" \
            --notes "APK signé avec la clé pérenne approuvée. Mise à jour de l'application existante via le service KnowMe et l'installateur Android."
          gh release view "$KNOWME_UPDATE_TAG" --json url -q .url
