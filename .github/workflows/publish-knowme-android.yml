name: Publish KnowMe signed Android APK

on:
  workflow_run:
    workflows: ["KnowMe Signed Android APK"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish-apk:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch signed artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ -n "${BUILD_RUN_ID:-}" ]]; then
            artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name=="knowme-android-apk" and .expired==false) | .id')"
            artifact_id="$(printf '%s\n' "$artifacts" | head -n1)"
          else
            artifact_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="knowme-android-apk" and .expired==false) | [.created_at, .id] | @tsv' | sort -r | head -n1 | cut -f2)"
          fi
          if [[ -z "${artifact_id:-}" ]]; then
            echo "::error::No signed KnowMe APK artifact found."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > artifact.zip
          mkdir -p dist
          unzip -j -o artifact.zip -d dist
          test -s dist/version.json
          VERSION="$(node -p 'require("./dist/version.json").version')"
          VERSION_CODE="$(node -p 'require("./dist/version.json").versionCode')"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          APK="KnowMe-${VERSION}.apk"
          test -s "dist/$APK"
          test -s "dist/$APK.sha256"
          (cd dist && sha256sum -c "$APK.sha256")
          unzip -tqq "dist/$APK"
          SHA="$(sha256sum "dist/$APK" | cut -d' ' -f1)"
          TAG="v${VERSION}-preview"
          export APK VERSION VERSION_CODE SHA TAG
          node -e '
            const fs = require("fs");
            const { APK, VERSION, VERSION_CODE, SHA, TAG } = process.env;
            const url = `https://github.com/Tresor562/knowMe_mpv/releases/download/${TAG}/${APK}`;
            const manifest = {
              version: VERSION,
              versionCode: Number(VERSION_CODE),
              url,
              sha256: SHA,
              notes: "Améliorations de KnowMe, sécurité et nouvelles fonctionnalités.",
              required: false
            };
            fs.writeFileSync("dist/knowme-update.json", JSON.stringify(manifest));
          '
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "APK_FILE=$APK" >> "$GITHUB_ENV"

      - name: Publish official release and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          APK="$APK_FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$APK" "dist/$APK.sha256" dist/knowme-update.json --clobber
          else
            gh release create "$TAG" "dist/$APK" "dist/$APK.sha256" dist/knowme-update.json \
              --prerelease \
              --title "KnowMe Android ${TAG}" \
              --notes "APK signé pour mises à jour intégrées. Android peut demander une confirmation d'installation."
          fi
          gh release view "$TAG" --json url -q .url
