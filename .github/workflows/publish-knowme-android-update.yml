name: Publish signed KnowMe Android update

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Description des nouveautés affichée dans KnowMe'
        required: false
        default: 'Navigation vers les profils, mentions et améliorations de KnowMe.'

permissions:
  contents: write

concurrency:
  group: knowme-signed-android-update
  cancel-in-progress: false

jobs:
  signed-update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: android-updates
    env:
      CI: '1'
      EXPO_PUBLIC_API_URL: https://31-56-85-53.sslip.io/knowme-api
      EXPO_PUBLIC_RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Confirm version parity and shipping readiness
        run: |
          set -euo pipefail
          node scripts/platform-sync-preflight.mjs --release
          node scripts/mobile-release-preflight.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const app = JSON.parse(fs.readFileSync('apps/mobile/app.json', 'utf8')).expo;
          const version = app.version;
          const code = app.android.versionCode;
          if (!/^\d+\.\d+\.\d+$/.test(version) || !Number.isSafeInteger(code) || code < 1) {
            throw new Error('Invalid Android release version');
          }
          console.log('Signed update candidate', version, 'versionCode', code);
          NODE

      - name: Prepare Expo-compatible workspace
        run: printf '%s\n' 'shamefully-hoist=true' > .npmrc
      - name: Install and type-check
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @knowme/mobile... build
      - name: Generate Android project
        run: pnpm --filter @knowme/mobile exec expo prebuild --platform android --clean --no-install

      - name: Build APK with stable private signing key
        env:
          KNOWME_ANDROID_KEYSTORE_BASE64: ${{ secrets.KNOWME_ANDROID_KEYSTORE_BASE64 }}
          KNOWME_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KNOWME_ANDROID_KEYSTORE_PASSWORD }}
          KNOWME_ANDROID_KEY_ALIAS: ${{ secrets.KNOWME_ANDROID_KEY_ALIAS }}
          KNOWME_ANDROID_KEY_PASSWORD: ${{ secrets.KNOWME_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in KNOWME_ANDROID_KEYSTORE_BASE64 KNOWME_ANDROID_KEYSTORE_PASSWORD KNOWME_ANDROID_KEY_ALIAS KNOWME_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing Android signing configuration: $key. No APK is published."
              exit 1
            fi
          done
          export KNOWME_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/knowme-release.keystore"
          umask 077
          printf '%s' "$KNOWME_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KNOWME_ANDROID_KEYSTORE_PATH"
          test -s "$KNOWME_ANDROID_KEYSTORE_PATH"
          node scripts/configure-knowme-android-signing.mjs
          (cd apps/mobile/android && ./gradlew assembleRelease --no-daemon --stacktrace)
          rm -f "$KNOWME_ANDROID_KEYSTORE_PATH"

      - name: Verify signature, package, version and checksum
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./apps/mobile/app.json").expo.version')"
          CODE="$(node -p 'require("./apps/mobile/app.json").expo.android.versionCode')"
          TAG="v$VERSION"
          APK="KnowMe-$VERSION.apk"
          ORIGINAL=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          test -s "$ORIGINAL"
          TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$TOOLS/apksigner" verify --verbose --print-certs "$ORIGINAL"
          META="$("$TOOLS/aapt" dump badging "$ORIGINAL" | head -n 1)"
          if [[ "$META" != *"name='com.knowme.app' versionCode='$CODE'"* ]]; then
            echo "::error::Unexpected app package or version. Update not released."
            exit 1
          fi
          mkdir -p dist
          cp "$ORIGINAL" "dist/$APK"
          (cd dist && sha256sum "$APK" > "$APK.sha256")
          export RELEASE_APK="$APK"
          export RELEASE_TAG="$TAG"
          export RELEASE_NOTES="${{ inputs.release_notes }}"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const app = JSON.parse(fs.readFileSync('apps/mobile/app.json', 'utf8')).expo;
          const apk = process.env.RELEASE_APK;
          const hash = fs.readFileSync('dist/' + apk + '.sha256', 'utf8').split(' ')[0];
          const notice = {
            versionCode: app.android.versionCode,
            version: app.version,
            url: 'https://github.com/Tresor562/knowMe_mpv/releases/download/' +
              process.env.RELEASE_TAG + '/' + apk,
            sha256: hash,
            notes: (process.env.RELEASE_NOTES || 'Une nouvelle version de KnowMe est disponible.').slice(0, 500),
            required: false
          };
          fs.writeFileSync('dist/knowme-update.json', JSON.stringify(notice, null, 2) + '\n');
          NODE
          (cd dist && sha256sum -c "$APK.sha256")
          test -s dist/knowme-update.json

      - name: Publish exactly one immutable official GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./apps/mobile/app.json").expo.version')"
          TAG="v$VERSION"
          APK="KnowMe-$VERSION.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release tag already exists. Bump version before publishing."
            exit 1
          fi
          gh release create "$TAG" \
            "dist/$APK" "dist/$APK.sha256" "dist/knowme-update.json" \
            --target "$GITHUB_SHA" \
            --title "KnowMe Android $VERSION" \
            --notes "APK signée avec la clé de production. Mise à jour proposée directement dans KnowMe compatible."
