name: KnowMe unified release qualification

on:
  workflow_dispatch:
  push:
    tags:
      - 'knowme-v*'

permissions:
  contents: read

jobs:
  unified-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_PUBLIC_API_URL: https://31-56-85-53.sslip.io/knowme-api
      EXPO_PUBLIC_RELEASE_COMMIT: ${{ github.sha }}
      KNOWME_RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify source parity and reject incomplete features
        run: |
          node --test scripts/platform-sync-preflight.test.mjs scripts/check-platform-deployment.test.mjs
          node scripts/platform-sync-preflight.mjs --release
      - name: Install frozen dependencies
        run: |
          printf '%s\n' 'shamefully-hoist=true' > .npmrc
          pnpm install --frozen-lockfile
      - name: Compile Web API and mobile against one commit
        run: pnpm build
      - name: Generate identical native Android source
        run: pnpm --filter @knowme/mobile exec expo prebuild --platform android --clean --no-install
      - name: Verify Android binary compilation
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Record qualified commit
        run: |
          mkdir -p release-artifacts
          node -e 'const fs=require("fs");const p=require("./packages/link-contract/src/platform-sync.json");fs.writeFileSync("release-artifacts/source.json",JSON.stringify({sha:process.env.GITHUB_SHA,version:p.productVersion,revision:p.contractRevision,qualified:true},null,2))'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: knowme-unified-release-proof
          path: release-artifacts/source.json
          if-no-files-found: error
          retention-days: 30
