name: KnowMe one-time SVG lockfile refresh
on:
  push:
    branches:
      - chat/design/vector-icons-tactile-web-android
permissions:
  contents: write
concurrency:
  group: knowme-svg-lockfile-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'Tresor562/knowMe_mpv'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - name: Regenerate only the resolved pnpm native dependency graph
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"react-native-svg": "15.11.2"' apps/mobile/package.json
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          git diff --exit-code -- apps/mobile/package.json
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore(design): resolve native SVG pnpm lockfile"
            git push origin HEAD:chat/design/vector-icons-tactile-web-android
          fi
